name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: Test deployment status handling
        run: bash scripts/tests/deploy-railway-test.sh
      - name: Build and test the production image
        run: docker build --tag skarb-kibica:ci .
      - name: Check HTTP behavior and persistent H2 storage
        run: bash scripts/smoke-container.sh skarb-kibica:ci

  deploy:
    name: Deploy production
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.RAILWAY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    concurrency:
      group: railway-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: Install the pinned Railway CLI
        run: npm install --global @railway/cli@5.59.0
      - name: Deploy this commit and check the public application
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          ENVIRONMENT_ID: ${{ vars.ENVIRONMENT_ID }}
          SERVICE_ID: ${{ vars.SERVICE_ID }}
          APP_URL: ${{ vars.APP_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/deploy-railway.sh
