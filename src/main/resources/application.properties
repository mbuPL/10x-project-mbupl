spring.application.name=SkarbKibica
server.port=${PORT:8080}

# H2 stores data outside the application JAR. Set DB_PATH to an absolute path
# on a persistent volume when deploying (for example /data/skarb-kibica).
spring.datasource.url=jdbc:h2:file:${DB_PATH:./data/skarb-kibica}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
